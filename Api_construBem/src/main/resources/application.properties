spring.application.name=Api_construBem


# Configuração do Banco de Dados H2 em modo arquivo
spring.datasource.url=jdbc:h2:file:./data/construbem-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilita o console web do H2 para acessar pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false


server.port=8089